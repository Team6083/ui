name: Publish

# Publishes the package to npm (registry.npmjs.org) through trusted publishing:
# npm trusts this workflow file, so the repository holds no npm token, and each
# version carries provenance.
# - A push to main publishes <version>-alpha.<run number> under the "next"
#   dist-tag, <version> being package.json's without its prerelease part.
# - A version tag publishes the release as "latest". The tag must match
#   package.json: v0.1.0 for "version": "0.1.0".
# npm allows one trusted workflow per package, so both live in this file.
on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        if: github.ref_type == 'tag'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Set the prerelease version
        if: github.ref_type == 'branch'
        run: |
          base="$(node -p 'require("./package.json").version.split("-")[0]')"
          npm version --no-git-tag-version "${base}-alpha.${GITHUB_RUN_NUMBER}"

      # prepack builds dist/. Trusted publishing needs npm 11.5.1 or later;
      # Node 26 ships with it.
      - name: Publish
        run: npm publish --tag "${{ github.ref_type == 'tag' && 'latest' || 'next' }}"

      - name: Summary
        run: echo "Published @team6083/ui@$(node -p 'require("./package.json").version') (${{ github.ref_type == 'tag' && 'latest' || 'next' }})" >> "$GITHUB_STEP_SUMMARY"
