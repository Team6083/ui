name: Release

# Stages a release on npm (registry.npmjs.org) when a version tag is pushed; a
# maintainer approves it with 2FA before it goes live, so nothing reaches npm
# on the workflow's word alone. The tag must match package.json: v0.1.1 for
# "version": "0.1.1". Trusted publishing: npm trusts this workflow file to
# stage, so the repository holds no npm token, and each version carries
# provenance. Prereleases go to GitHub Packages instead (prerelease.yml).
on:
  push:
    # Release tags only: v0.2.0, not v0.2.0-alpha.1. Prereleases come from
    # prerelease.yml.
    tags: [ "v*.*.*", "!v*-*" ]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      # prepack builds dist/. npm stage publish needs npm 11.15.0 or later;
      # Node 26 ships with it.
      - name: Stage
        run: npm stage publish

      - name: Summary
        run: echo "Staged @team6083/ui@$(node -p 'require("./package.json").version'); approve it under Staged Packages on npmjs.com, or with npm stage approve" >> "$GITHUB_STEP_SUMMARY"
