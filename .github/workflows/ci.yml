name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # main's history, for the changeset check.
          fetch-depth: 0

      # The Node the package is developed on; engines is only the minimum for apps.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Later steps use !cancelled() so one failing check does not hide the others.
      - name: Type check
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

      # A PR that changes the package says how in a changeset (npx changeset);
      # one that changes nothing apps see adds an empty one (npx changeset --empty).
      # A release PR (release/vX.Y.Z) consumes them, so it is skipped.
      - name: Changeset
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/') }}
        run: npx changeset status --since=origin/main

      - name: Audit production dependencies
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
