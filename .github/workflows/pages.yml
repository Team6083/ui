name: Pages

# Builds the demo (demo/) from main and publishes it on GitHub Pages.
# Skipped while the repository is private: Pages needs it public on this plan.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is /ui for a project site, empty on a custom domain.
      - name: Build the demo
        run: npm run demo:build
        env:
          DEMO_BASE: ${{ steps.pages.outputs.base_path }}/
          VITE_COMMIT: ${{ github.sha }}
          VITE_BUILT_AT: ${{ github.event.head_commit.timestamp }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
