name: Prerelease

# Every push to main that changes the package publishes <version>-alpha.<n>
# under the "next" dist-tag to GitHub Packages, so a change can be tried before
# it is released. <version> is what the next release will be: the pending
# changesets' bump on the last release, or at least the patch after the latest
# release tag. <n> counts the commits since that tag, so every alpha sorts above
# the last release and a re-run publishes nothing new. package.json's version
# changes only in a release PR (changeset version). Releases go to npm
# (release.yml); prereleases stay off it.
on:
  push:
    branches: [ "main" ]
    # What reaches the published package, and this workflow itself.
    paths:
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "README.md"
      - "LICENSE"
      - ".changeset/**"
      - ".github/workflows/prerelease.yml"

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # The tags and history, to find the latest release and count since it.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@team6083"

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Set the prerelease version
        id: version
        run: |
          # Release tags only (v0.1.0), not prerelease ones (v0.2.0-rc.1).
          if tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' --exclude '*-*' 2>/dev/null)"; then
            count="$(git rev-list --count "${tag}..HEAD")"
          else
            tag="v0.0.0"
            count="$(git rev-list --count HEAD)"
          fi
          # The version the pending changesets release; exits 1 when there are none.
          npx changeset status --output "${RUNNER_TEMP}/changesets.json" >/dev/null || true
          version="$(TAG="${tag#v}" COUNT="${count}" STATUS="${RUNNER_TEMP}/changesets.json" node -e '
            const fs = require("fs")
            const parse = (v) => v.split("-")[0].split(".").map(Number)
            const higher = (a, b) => { const i = a.findIndex((n, j) => n !== b[j]); return i !== -1 && a[i] > b[i] ? a : b }
            const [major, minor, patch] = parse(process.env.TAG)
            let base = [major, minor, patch + 1]
            // package.json: above the tag only between a release PR and its tag.
            base = higher(parse(require("./package.json").version), base)
            if (fs.existsSync(process.env.STATUS)) {
              const release = JSON.parse(fs.readFileSync(process.env.STATUS, "utf8")).releases.find((r) => r.name === "@team6083/ui")
              if (release?.newVersion) base = higher(parse(release.newVersion), base)
            }
            console.log(`${base.join(".")}-alpha.${process.env.COUNT}`)
          ')"
          npm version --no-git-tag-version --allow-same-version "${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Already published from this commit: a re-run, nothing to do. From
          # another commit: the count collided, so stop rather than skip.
          if published="$(npm view "@team6083/ui@${version}" gitHead 2>/dev/null)" && [ -n "${published}" ]; then
            if [ "${published}" != "$(git rev-parse HEAD)" ]; then
              echo "@team6083/ui@${version} was published from ${published}, not this commit" >&2
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A re-run of the same commit finds its version already published.
      # prepack builds dist/.
      - name: Publish
        if: ${{ steps.version.outputs.exists != 'true' }}
        run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          if [ "${EXISTS}" = "true" ]; then
            echo "@team6083/ui@${VERSION} was already published" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published @team6083/ui@${VERSION} (next)" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}
          EXISTS: ${{ steps.version.outputs.exists }}
